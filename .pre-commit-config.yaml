# pre-commit 配置文件
# 安装: pip install pre-commit
# 启用: pre-commit install
# 运行: pre-commit run --all-files

repos:
  # 基础检查
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      # 检查 Python 语法
      - id: check-ast
        name: "Python 语法检查"
        description: "检查 Python 文件语法是否正确"
      
      # 检查 JSON 语法
      - id: check-json
        name: "JSON 语法检查"
        files: \.json$
      
      # 检查 YAML 语法
      - id: check-yaml
        name: "YAML 语法检查"
        files: \.(yaml|yml)$
      
      # 检查合并冲突标记
      - id: check-merge-conflict
        name: "合并冲突标记检查"
      
      # 检查调试语句
      - id: debug-statements
        name: "调试语句检查"
        description: "检查是否遗留 pdb、print 等调试语句"
      
      # 去除行尾空格
      - id: trailing-whitespace
        name: "行尾空格去除"
        args: [--markdown-linebreak-ext=md]
      
      # 文件末尾空行
      - id: end-of-file-fixer
        name: "文件末尾空行修复"
      
      # 检查超大文件
      - id: check-added-large-files
        name: "大文件检查"
        args: ['--maxkb=1000']
      
      # 检查 shebang
      - id: check-shebang-scripts-are-executable
        name: "Shebang 检查"
      
      # 检查可执行文件权限
      - id: check-executables-have-shebangs
        name: "可执行文件 Shebang 检查"

  # Black 代码格式化
  - repo: https://github.com/psf/black
    rev: 23.3.0
    hooks:
      - id: black
        name: "Black 代码格式化"
        language_version: python3
        args: 
          - --line-length=120
          - --target-version=py310
        exclude: 
          (?x)^(
            migrations/|
            venv/|
            __pycache__/
          )

  # isort 导入排序
  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort
        name: "isort 导入排序"
        args: 
          - --profile=black
          - --line-length=120
          - --multi-line=3
          - --trailing-comma

  # Flake8 代码检查
  - repo: https://github.com/PyCQA/flake8
    rev: 6.0.0
    hooks:
      - id: flake8
        name: "Flake8 代码检查"
        args: 
          - --max-line-length=120
          - --extend-ignore=E203,W503
          - --max-complexity=15
          - --select=E,W,F
        exclude: 
          (?x)^(
            migrations/|
            venv/|
            __pycache__/|
            tests/
          )

  # 类型检查 (可选，需要 mypy)
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.3.0
  #   hooks:
  #     - id: mypy
  #       name: "Mypy 类型检查"
  #       additional_dependencies: [types-all]
  #       args: [--ignore-missing-imports]

  # 检查 requirements.txt
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: requirements-txt-fixer
        name: "requirements.txt 修复"
        files: requirements.*\.txt$

  # Markdown 格式检查
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-markdown
        name: "Markdown 检查"
        files: \.md$

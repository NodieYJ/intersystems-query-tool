[metadata]
name = pywindows
description = 基于 PySide2 的桌面应用程序
long_description = file: README.md
long_description_content_type = text/markdown
author = PyWindows Team
python_requires = >=3.10

[options]
packages = find:
package_dir =
    = src
include_package_data = True
install_requires =
    PySide2>=5.15
    cryptography>=3.0

[options.packages.find]
where = src

[bdist_wheel]
universal = 0

[flake8]
# 最大行长度
max-line-length = 120

# 忽略的错误
extend-ignore =
    E203,  # 空格在冒号前（与 black 兼容）
    W503,  # 二元运算符前的换行（与 black 兼容）
    E501,  # 行过长（已由 max-line-length 控制）

# 排除的目录
exclude =
    .git,
    __pycache__,
    venv,
    env,
    .venv,
    build,
    dist,
    migrations,
    tests

# 最大复杂度
max-complexity = 15

# 选择检查的错误类型
select = E,W,F,C

# 显示统计信息
show-source = True
statistics = True

[isort]
# 使用 black 兼容的配置
profile = black

# 最大行长度
line_length = 120

# 多行导入格式
multi_line_output = 3

# 包含尾随逗号
include_trailing_comma = True

# 强制单行导入
force_single_line = False

# 标准库导入
known_standard_library = typing,pathlib,dataclasses

# 第三方库导入
known_third_party = PySide2,cryptography

# 本地库导入
known_first_party = src

# 导入分组
sections = FUTURE,STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER

# 跳过检查的目录
skip = venv,__pycache__,migrations

[mypy]
# 忽略缺失的导入
ignore_missing_imports = True

# 检查未类型化的定义
check_untyped_defs = True

# 不允许未类型化的调用
disallow_untyped_calls = False

# 不允许未类型化的定义
disallow_untyped_defs = False

# 警告返回值
warn_return_any = True

# 排除的模块
exclude = venv|__pycache__|migrations|tests

[tool:pytest]
# 测试目录
testpaths = tests

# Python 文件模式
python_files = test_*.py

# 添加 src 到路径
pythonpath = src

# 详细的测试输出
verbose = True

# 显示本地变量
showlocals = True

# 覆盖率配置
addopts = 
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=80

# 标记
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests

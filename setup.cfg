[metadata]
name = pywindows
description = PySide2 Desktop Application
long_description = file: README.md
long_description_content_type = text/markdown
author = PyWindows Team
python_requires = >=3.8

[options]
packages = find:
package_dir =
    = src
include_package_data = True
install_requires =
    PySide2>=5.14.0
    cryptography>=3.4.8

[options.packages.find]
where = src

[bdist_wheel]
universal = 0

[flake8]
# Max line length
max-line-length = 120

# Extended ignore
extend-ignore =
    E203,
    W503,
    E501,

# Excluded directories
exclude =
    .git,
    __pycache__,
    venv,
    env,
    .venv,
    build,
    dist,
    migrations,
    tests

# Max complexity
max-complexity = 15

# Selected checks
select = E,W,F,C

# Show source
show-source = True

# Show statistics
statistics = True

[isort]
# Black compatible profile
profile = black

# Max line length
line_length = 120

# Multi line output
multi_line_output = 3

# Include trailing comma
include_trailing_comma = True

# Force single line
force_single_line = False

# Known standard library
known_standard_library = typing,pathlib,dataclasses

# Known third party
known_third_party = PySide2,cryptography

# Known first party
known_first_party = src

# Import sections
sections = FUTURE,STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER

# Skip directories
skip = venv,__pycache__,migrations

[mypy]
# Ignore missing imports
ignore_missing_imports = True

# Check untyped defs
check_untyped_defs = True

# Disallow untyped calls
disallow_untyped_calls = False

# Disallow untyped defs
disallow_untyped_defs = False

# Warn return any
warn_return_any = True

# Exclude
exclude = venv|__pycache__|migrations|tests

[tool:pytest]
# Test paths
testpaths = tests

# Python files pattern
python_files = test_*.py

# Python path
pythonpath = src

# Verbose output
verbose = True

# Show locals
showlocals = True

# Coverage options
addopts = 
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=80

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests

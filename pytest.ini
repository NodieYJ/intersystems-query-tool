[tool.pytest.ini_options]
# 测试目录配置
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# 覆盖率配置
addopts = """
    --strict-markers
    --tb=short
    --strict-config
    -v
"""

# 标记定义
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "gui: marks tests as GUI tests",
]

# 测试发现配置
pythonpath = ["src", "."]

# 警告过滤
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# 日志配置
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.coverage.run]
# 覆盖率运行配置
source = ["src"]
branch = true
parallel = true
omit = [
    "tests/*",
    "*/__pycache__/*",
    "*/__init__.py",
    "src/main.py",
    "src/presentation/windows/*_backup.py",
    "src/stubs/*",
]

[tool.coverage.report]
# 覆盖率报告配置
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abstractclassmethod",
    "@abstractproperty",
]
fail_under = 70
show_missing = true
skip_covered = false

[tool.coverage.html]
# HTML报告配置
directory = "coverage_html_report"
title = "PyWindows Coverage Report"

[tool.coverage.xml]
# XML报告配置
output = "coverage.xml"

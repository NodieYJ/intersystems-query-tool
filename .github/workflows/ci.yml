name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    runs-on: windows-latest
    
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    
    steps:
    # 检出代码
    - name: Checkout code
      uses: actions/checkout@v3
    
    # 设置 Python
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    # 缓存 pip 依赖
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    # 安装依赖
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install black flake8 isort pytest pytest-cov
    
    # 检查 Python 语法
    - name: Check Python syntax
      run: |
        python -m py_compile src/main.py
        python -m py_compile src/infrastructure/utils/scaling_manager.py
        python -m py_compile src/data/repositories/driver_factory.py
        python -m py_compile src/infrastructure/config/ui_config.py
      shell: cmd
    
    # 运行 Black 格式检查
    - name: Check code formatting with Black
      run: |
        black --check --line-length=120 src/ tests/
      continue-on-error: true
    
    # 运行 Flake8 代码检查
    - name: Lint with Flake8
      run: |
        flake8 src/ tests/ --count --select=E,W,F --max-line-length=120 --extend-ignore=E203,W503 --max-complexity=15 --statistics
      continue-on-error: true
    
    # 检查导入排序
    - name: Check import sorting with isort
      run: |
        isort --check-only --profile=black --line-length=120 src/ tests/
      continue-on-error: true
    
    # 运行单元测试
    - name: Run unit tests
      run: |
        python -m pytest tests/unit -v --tb=short
    
    # 生成测试报告
    - name: Generate test report
      run: |
        python -m pytest tests/unit --cov=src --cov-report=xml --cov-report=html
      continue-on-error: true
    
    # 上传测试报告
    - name: Upload coverage report
      uses: codecov/codecov-action@v3
      if: matrix.python-version == '3.10'
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
        verbose: true
      continue-on-error: true

  # 代码质量检查（静态分析）
  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install black flake8 isort
    
    # 检查代码格式
    - name: Check formatting
      run: |
        black --check --diff --line-length=120 src/ tests/ || true
    
    # 检查代码复杂度
    - name: Check complexity
      run: |
        flake8 src/ --count --max-complexity=15 --statistics --select=C901 || true
    
    # 检查导入排序
    - name: Check imports
      run: |
        isort --check-only --diff --profile=black src/ tests/ || true

  # Windows 特定测试
  windows-test:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest
    
    # Windows 特定：测试文件路径处理
    - name: Test file paths
      run: |
        python -c "from pathlib import Path; print(Path('src/main.py').exists())"
    
    # 测试关键模块导入
    - name: Test imports
      run: |
        python -c "from src.infrastructure.utils.scaling_manager import get_scaling_manager"
        python -c "from src.data.repositories.driver_factory import get_driver_factory"
        python -c "from src.infrastructure.config.ui_config import get_ui_config"
